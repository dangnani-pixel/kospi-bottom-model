# 평일 장 마감 뒤 데이터를 새로 받아 신호를 계산하고, 결과를 커밋한 다음 GitHub Pages에 배포한다.
name: Daily update

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST (월~금). GitHub 사정으로 몇십 분 늦게 돌 수 있음
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["index.html", "kosdaq.html", "kosdaq.py", "ohlc.py", "new_highs.py", "levels.py", "highs.html", "kospi_bottom_model.py", "intraday.py", "exports.py", "backtest/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "pandas<3" numpy "pykrx==1.2.9" holidays

      - name: Install trend tools (trendln·pytrendline·pricelevels, 실패해도 나머지는 진행)
        continue-on-error: true
        run: |
          pip install "trendln==0.1.18" "pytrendline==1.0.1" scikit-learn cython setuptools wheel
          pip install --no-build-isolation "zigzag==0.1.3"
          pip install --no-deps "pricelevels==0.0.4"

      - name: Run model
        id: model
        continue-on-error: true
        env:
          # KRX 정보데이터시스템 계정 (Settings > Secrets and variables > Actions). 없으면 PBR은 네이버 추정치만 사용
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python kospi_bottom_model.py

      - name: KOSDAQ index
        continue-on-error: true
        run: python kosdaq.py

      - name: Korea exports, daily average (관세청 수출입총괄)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python exports.py

      - name: Daily OHLC for weekly candles
        continue-on-error: true
        run: python ohlc.py

      - name: Trendlines and support/resistance (trendln, site only)
        continue-on-error: true
        run: python levels.py

      - name: 52-week highs (site only, not committed)
        continue-on-error: true
        run: python new_highs.py

      - name: Commit new data
        if: steps.model.outcome == 'success'
        run: |
          if git diff --quiet -- signals_daily.csv pbr_history.csv kosdaq_daily.csv kospi_ohlc.csv kosdaq_ohlc.csv exports_monthly.csv && [ -z "$(git ls-files --others --exclude-standard kosdaq_daily.csv kospi_ohlc.csv kosdaq_ohlc.csv exports_monthly.csv)" ]; then
            echo "No new trading day; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signals_daily.csv report.md kospi_history.csv pbr_history.csv kosdaq_daily.csv kospi_ohlc.csv kosdaq_ohlc.csv
            [ -f exports_monthly.csv ] && git add exports_monthly.csv
            git commit -m "Update signals $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Collect site files
        run: |
          mkdir -p _site/backtest
          cp index.html signals_daily.csv report.md pbr_history.csv _site/
          cp kosdaq.html _site/; [ -f kosdaq_daily.csv ] && cp kosdaq_daily.csv _site/ || true
          cp kospi_ohlc.csv kosdaq_ohlc.csv _site/ 2>/dev/null || true
          [ -f exports_monthly.csv ] && cp exports_monthly.csv _site/ || true
          cp highs.html _site/; [ -d highs ] && cp -r highs _site/ || true
          [ -d levels ] && cp -r levels _site/ || true
          cp backtest/*.pdf _site/backtest/
          # 장중에 이 워크플로가 돌면(코드 수정 push 등) 장중 잠정 값도 함께 배포해 실시간 패널이 사라지지 않게 한다
          python intraday.py && cp live.json _site/ || true
          [ -f kosdaq_live.json ] && cp kosdaq_live.json _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 업로드 직후 배포 단계가 업로드한 파일을 못 찾는 일이 있어(GitHub 목록 반영 지연) 잠깐 기다리고, 실패하면 한 번 더 시도
      - name: Wait for artifact to be listed
        run: sleep 20
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry wait
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub 예약 실행이 자주 빠져서, 이 실행이 끝날 때 장중 실행을 시작시킨다.
      # 장중 실행은 다음 장 시작(08:50 KST)까지 기다렸다가 장 마감까지 돈다.
      - name: Start intraday runner for next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/intraday.yml/dispatches" -d '{"ref":"main"}' \
            && echo "장중 실행 시작 요청" || echo "::warning::장중 실행 시작 요청 실패"

      - name: Report model failure
        if: steps.model.outcome == 'failure'
        run: |
          echo "::error::kospi_bottom_model.py failed; the site still shows the previous data."
          exit 1
